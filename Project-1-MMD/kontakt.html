<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Kontakt</title>
</head>
<body>
    <header>
        <nav class="navbar">
            <img src="img/logo.png" alt="" class="logo">
            <ul class="navbar__menu">
                <li><a href="index.html" class="navbar__link">Hjem</a></li>
                <li><a href="omos.html" class="navbar__link">Om os</a></li>
                <li><a href="kontakt.html" class="navbar__link">Kontakt</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="titel" id="home">
            <h1>Kontakt</h1>
            <p>Billede her???? </p>
            <p>Telefon: <a href="tel:12345678">12345678</a></p>
            <p>Kontakt os på mail <a href="mailto:info@taetpaadk.dk">heltetpaa@gmail.com</a></p>
        </section>
        
        <section class="kontakt-section">
            <h2>Send os en besked</h2>
            <form class="kontakt-form" action="mailto:miesim01@iba.dk" method="post" enctype="text/plain">
                <label for="navn">Navn</label>
                <input type="text" id="navn" name="navn" placeholder="Dit navn" required>

                <label for="mail">Email</label>
                <input type="email" id="mail" name="mail" placeholder="din@mail.dk" required>

                <label for="besked">Besked</label>
                <textarea id="besked" name="besked" rows="6" placeholder="Skriv din besked her..." required></textarea>

                <button type="submit" class="book-knap">SEND</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="mere-info">
            <h4>Helt tæt på</h4>
            <p>Telefon: <a href="tel:12345678">12345678</a></p>
            <p>Email: <a href="mailto:info@taetpaadk.dk">heltetpaa@gmail.com</a></p>
            <p>Adresse: <a href="https://www.google.com/maps/place/Eksempelgade+1,+1234+Byen" target="_blank" rel="noopener noreferrer">Eksempelgade 1, 1234 Byen</a></p>
            
        </div>
        
        <div class="footer-end">
            <img src="img/logo.png" alt="" class="logo footer-logo">
            <p class="footer">&copy; 2026 Helt tæt på</p>
        </div>
    </footer>

</body>
</html>
